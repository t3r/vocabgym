            TableName: !Ref LeaguesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LeagueMembersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref VocabSetsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProgressTable
        - DynamoDBReadPolicy:
            TableName: !Ref PracticeSessionsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        CreateLeague:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league
            Method: POST
        GetLeague:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/{leagueId}
            Method: GET
        UpdateLeague:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/{leagueId}
            Method: PUT
        DeleteLeague:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/{leagueId}
            Method: DELETE
        JoinLeague:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/join
            Method: POST
        GetLeaderboard:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/{leagueId}/leaderboard
            Method: GET
        GetMembers:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/{leagueId}/members
            Method: GET
        InviteStudent:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/{leagueId}/invite
            Method: POST
        RemoveMember:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /league/{leagueId}/members/{memberId}
            Method: DELETE
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /users/profile
            Method: PUT
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /users/profile
            Method: GET
        InviteUser:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /users/invite
            Method: POST

