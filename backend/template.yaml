AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VocabTrainer Backend - Multi-language vocabulary training app for German students

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment
  CertificateArn:
    Type: String
    Default: ''
    Description: "ACM certificate ARN (us-east-1) for custom domain. Required for custom domain. Covers *.vocab.gym.t3r.de and vocab.gym.t3r.de"
  HostedZoneId:
    Type: String
    Default: ''
    Description: "Route 53 Hosted Zone ID for gym.t3r.de. Required for automatic DNS record creation."

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  HasCustomDomain: !And
    - !Condition HasCertificate
    - !Condition HasHostedZone

Globals:
  Function:
    Runtime: python3.11
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        USERS_TABLE: !Ref UsersTable
        VOCABSETS_TABLE: !Ref VocabSetsTable
        VOCABITEMS_TABLE: !Ref VocabItemsTable
        SESSIONS_TABLE: !Ref PracticeSessionsTable
        PROGRESS_TABLE: !Ref ProgressTable
        IMAGES_BUCKET: !Ref ImagesBucket
        LEAGUES_TABLE: !Ref LeaguesTable
        LEAGUE_MEMBERS_TABLE: !Ref LeagueMembersTable
        GOALS_TABLE: !Ref LearningGoalsTable
        REGION: !Ref AWS::Region
    Layers:
      - !Ref SharedLayer

Resources:
  # ============================================================
  # Cognito Authentication
  # ============================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub vocabtrainer-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "Dein VocabGym-Konto wurde erstellt"
          EmailMessage: "Hallo! Dein Lehrer hat ein VocabGym-Konto für dich erstellt. Dein Benutzername ist {username} und dein temporäres Passwort ist {####}. Bitte melde dich an und ändere dein Passwort."

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub vocabtrainer-web-client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - http://localhost:5173/callback
        - !Sub https://${FrontendDistribution.DomainName}/callback
        - !If
          - HasCertificate
          - !If [IsProd, 'https://vocab.gym.t3r.de/callback', !Sub 'https://${Environment}.vocab.gym.t3r.de/callback']
          - !Ref AWS::NoValue
      LogoutURLs:
        - http://localhost:5173
        - !Sub https://${FrontendDistribution.DomainName}
        - !If
          - HasCertificate
          - !If [IsProd, 'https://vocab.gym.t3r.de', !Sub 'https://${Environment}.vocab.gym.t3r.de']
          - !Ref AWS::NoValue
      SupportedIdentityProviders:
        - COGNITO

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub vocabtrainer-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref CognitoUserPool

  CognitoTeachersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: teachers
      UserPoolId: !Ref CognitoUserPool
      Description: Lehrkräfte mit erweiterten Rechten (Liga erstellen/verwalten)

  # ============================================================
  # S3 Storage
  # ============================================================
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub vocabtrainer-images-${Environment}-${AWS::AccountId}
      # Emit S3 events to the default EventBridge bus so the icon_handler can
      # render identicons on upload. Using EventBridge (not a direct Lambda
      # notification) avoids a circular dependency between the bucket and the
      # function's permission, and lets us filter by prefix in the rule.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - POST
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          # Original scans (images/) are deleted by the vocab_crud handler when a
          # set is approved. This rule is only a fallback for sets that are never
          # approved, so originals never linger. Identicons are NOT covered here.
          - Id: DeleteOriginalsAfter30Days
            Status: Enabled
            Prefix: images/
            ExpirationInDays: 30
          - Id: DeleteTtsCacheAfter30Days
            Status: Enabled
            Prefix: tts/
            ExpirationInDays: 30
          # Note: the identicons/ prefix intentionally has NO expiration rule —
          # identicons are the persistent visual identity of a vocab set.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  VocabSetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-vocabsets-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: vocabSetId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: vocabSetId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  VocabItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-vocabitems-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: vocabSetId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: vocabSetId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  PracticeSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-sessions-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: vocabSetId
          AttributeType: S
        - AttributeName: completedAt
          AttributeType: N
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: vocabSetId-completedAt-index
          KeySchema:
            - AttributeName: vocabSetId
              KeyType: HASH
            - AttributeName: completedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-progress-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: progressKey
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: progressKey
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  TtsUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-tts-usage-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: windowStart
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: windowStart
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ExtractionUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-extraction-usage-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: windowStart
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: windowStart
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ============================================================
  # API Gateway
  # ============================================================
  VocabTrainerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub vocabtrainer-api-${Environment}
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        # MEDIUM-02: CORS currently allows all origins for development flexibility.
        # Production deployments should restrict AllowOrigin to the CloudFront
        # distribution domain or custom domain (e.g., vocab.gym.t3r.de).
        # Current '*' is mitigated by Cognito JWT authentication on all endpoints.
        # To restrict in prod: use AWS::ApiGateway::GatewayResponse with conditional
        # Access-Control-Allow-Origin header based on Environment parameter.
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # API Gateway Usage Plan with Throttling (MEDIUM-01 fix)
  # Protects against brute-force attacks and excessive API usage
  VocabTrainerApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub vocabtrainer-usage-plan-${Environment}
      Description: Rate limiting for VocabTrainer API endpoints
      ApiStages:
        - ApiId: !Ref VocabTrainerApi
          Stage: !Ref Environment
      Throttle:
        BurstLimit: 100    # Max concurrent requests
        RateLimit: 50      # Requests per second

  # ============================================================
  # Shared Lambda Layer
  # ============================================================
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub vocabtrainer-shared-${Environment}
      Description: Shared utilities for VocabTrainer Lambda functions
      ContentUri: layers/shared/
      CompatibleRuntimes:
        - python3.11
      CompatibleArchitectures:
        - x86_64

  # ============================================================
  # Lambda Functions
  # ============================================================
  UploadHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vocabtrainer-upload-handler-${Environment}
      CodeUri: functions/upload_handler/
      Handler: app.lambda_handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabSetsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        UploadVocab:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /vocab/upload
            Method: POST

  ExtractionHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vocabtrainer-extraction-handler-${Environment}
      CodeUri: functions/extraction_handler/
      Handler: app.lambda_handler
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          EXTRACTION_PROMPT_PARAM: !Ref ExtractionPromptParam
          VERIFICATION_PROMPT_PARAM: !Ref VerificationPromptParam
          EXTRACTION_USAGE_TABLE: !Ref ExtractionUsageTable
          GUARDRAIL_ID: !GetAtt ExtractionGuardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt ExtractionGuardrailVersion.Version
          EXTRACTION_QUEUE_URL: !Ref ExtractionQueue
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabSetsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExtractionUsageTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ExtractionQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: !Sub vocabtrainer/${Environment}/prompts/*
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - textract:DetectDocumentText
              Resource: '*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource:
                - !GetAtt ExtractionGuardrail.GuardrailArn
      Events:
        ProcessVocab:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /vocab/process
            Method: POST
        GetExtraction:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /vocab/extraction/{vocabSetId}
            Method: GET

  # ============================================================
  # Async extraction: SQS queue + DLQ + worker Lambda
  # Decouples Textract+Bedrock from the API request (no 29s API Gateway limit).
  # ============================================================
  ExtractionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub vocabtrainer-extraction-dlq-${Environment}
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment

  ExtractionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub vocabtrainer-extraction-queue-${Environment}
      # Must be >= 6x the worker function timeout (300s) per AWS guidance.
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 345600  # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractionDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment

  ExtractionWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vocabtrainer-extraction-worker-${Environment}
      CodeUri: functions/extraction_handler/
      Handler: worker.lambda_handler
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          EXTRACTION_PROMPT_PARAM: !Ref ExtractionPromptParam
          VERIFICATION_PROMPT_PARAM: !Ref VerificationPromptParam
          GUARDRAIL_ID: !GetAtt ExtractionGuardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt ExtractionGuardrailVersion.Version
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabSetsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabItemsTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub vocabtrainer/${Environment}/prompts/*
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - textract:DetectDocumentText
              Resource: '*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource:
                - !GetAtt ExtractionGuardrail.GuardrailArn
      Events:
        ExtractionJob:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractionQueue.Arn
            BatchSize: 1
            # Cap concurrent workers so 10+ images don't hammer Bedrock (throttling).
            ScalingConfig:
              MaximumConcurrency: 5

  ExtractionWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vocabtrainer-extraction-worker-${Environment}
      RetentionInDays: !If [IsProd, 90, 7]

  VocabCrudHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vocabtrainer-vocab-crud-handler-${Environment}
      CodeUri: functions/vocab_crud_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          LEAGUES_TABLE: !Ref LeaguesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabSetsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabItemsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProgressTable
        - DynamoDBReadPolicy:
            TableName: !Ref LeaguesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        ListVocabSets:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /vocab
            Method: GET
        GetVocabSet:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /vocab/{vocabSetId}
            Method: GET
        UpdateVocabSet:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /vocab/{vocabSetId}
            Method: PUT
        DeleteVocabSet:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /vocab/{vocabSetId}
            Method: DELETE

  PracticeHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vocabtrainer-practice-handler-${Environment}
      CodeUri: functions/practice_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          LEAGUES_TABLE: !Ref LeaguesTable
          LEAGUE_MEMBERS_TABLE: !Ref LeagueMembersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VocabItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PracticeSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LeagueMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        # Ownership/league resolution in handle_start reads VocabSets + Leagues.
        - DynamoDBReadPolicy:
            TableName: !Ref VocabSetsTable
        - DynamoDBReadPolicy:
            TableName: !Ref LeaguesTable
      Events:
        StartPractice:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /practice/start
            Method: POST
        SubmitAnswer:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /practice/submit
            Method: POST
        CompletePractice:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /practice/complete
            Method: POST

  ProgressHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vocabtrainer-progress-handler-${Environment}
      CodeUri: functions/progress_handler/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProgressTable
        - DynamoDBReadPolicy:
            TableName: !Ref PracticeSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VocabSetsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VocabItemsTable
        # League access resolution in handle_vocab_set_progress reads Users + Leagues.
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref LeaguesTable
      Events:
        GetOverview:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /progress/overview
            Method: GET
        GetVocabSetProgress:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /progress/{vocabSetId}
            Method: GET

  # ============================================================
  # League Tables
  # ============================================================
  LeaguesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-leagues-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: leagueId
          AttributeType: S
        - AttributeName: joinCode
          AttributeType: S
      KeySchema:
        - AttributeName: leagueId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: joinCode-index
          KeySchema:
            - AttributeName: joinCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  LeagueMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-league-members-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: leagueId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: leagueId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE

  LearningGoalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub vocabtrainer-goals-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: goalId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: goalId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ============================================================
  # Prompt Templates (SSM Parameter Store)
  # ============================================================
  ExtractionPromptParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /vocabtrainer/${Environment}/prompts/extraction
      Type: String
      Description: "LLM prompt template for vocabulary extraction from raw OCR text. Placeholders: $lang_name_de, $raw_text"
      Value: |
        Du bekommst den OCR-Text einer Schulbuchseite (Vokabular-Seite). Extrahiere ALLE Vokabelpaare (Deutsch ↔ $lang_name_de).

        Das Layout der Seite kann variieren:
        - Manchmal steht das $lang_name_de Wort links, die deutsche Übersetzung rechts
        - Manchmal gibt es Lautschrift in Klammern [ʃɑ̃ʒe] — diese IGNORIEREN
        - Manchmal gibt es Beispielsätze — diese NICHT als Vokabelpaar aufnehmen
        - Manchmal steht die Übersetzung in mehreren Teilen (z.B. "etw. tauschen; etw. austauschen")

        Regeln:
        1. Extrahiere NUR echte Vokabelpaare — ein $lang_name_de Wort/Phrase und seine deutsche Übersetzung
        2. "source" = deutsches Wort/Phrase, "target" = $lang_name_de Wort/Phrase
        3. Behalte Artikel (le/la/les, der/die/das, un/une) bei
        4. Behalte Abkürzungen wie "etw." (etwas), "jdn." (jemanden), "jdm." (jemandem), "qc" (quelque chose), "qn" (quelqu'un) bei
        5. Wenn eine Übersetzung mehrere Bedeutungen hat, fasse sie mit Semikolon zusammen (z.B. "etw. tauschen; etw. austauschen")
        6. Ignoriere: Lautschrift, Beispielsätze, Grammatik-Erklärungen, Konjugationstabellen, Seitenzahlen, Überschriften, Abschnittstitel (z.B. "Des appareils numériques — Digitale Geräte")
        7. Nimm auch bildbasierte Vokabeln auf (z.B. "un ordinateur portable" → "ein Laptop-Computer")
        8. Keine Duplikate — wenn dasselbe Wort mehrfach vorkommt, nimm es nur einmal auf
        9. Korrigiere OCR-Artefakte: z.B. "fun smartphone" → "un smartphone" (das f gehört nicht zum Wort)
        10. Entferne trailing Semikolons aus source und target
        11. Wenn ein Wort mehrere deutsche Übersetzungen hat, fasse sie zusammen (z.B. "jdm. etw. vorstellen; etw. präsentieren" für "présenter qc à qn")
        12. "ne ... que" ist die vollständige Form (nicht nur "ne que")

        Antworte NUR mit einem JSON-Array:
        [{"source": "deutsche Übersetzung", "target": "$lang_name_de Wort"}]

        Keine Erklärungen, kein Markdown, nur das JSON-Array.

        OCR-Text der Seite:
        $raw_text

  VerificationPromptParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /vocabtrainer/${Environment}/prompts/verification
      Type: String
      Description: "LLM prompt template for verifying Textract table-parsed vocab pairs. Placeholders: $lang_name, $pairs_text"
      Value: |
        Du bekommst eine Liste von OCR-extrahierten Einträgen aus einem Schulbuch. Deine Aufgabe ist es, daraus NUR echte Vokabelpaare (Deutsch ↔ $lang_name) zu extrahieren.

        WICHTIG - Ein gültiges Vokabelpaar erfüllt ALLE diese Kriterien:
        - Eine Seite ist Deutsch, die andere Seite ist $lang_name
        - Es handelt sich um eine Wort-für-Wort oder Phrase-für-Phrase Übersetzung
        - Beide Seiten haben eigenständige Bedeutung als Wort/Phrase

        NICHT gültig sind:
        - Erklärungsseiten (z.B. Satzzeichen, Grammatikregeln, Aussprachehinweise)
        - Beispielsätze ohne Übersetzung
        - Einträge wo beide Seiten dieselbe Sprache sind
        - Einträge wo eine Seite nur ein Beispielsatz ist (keine Übersetzung)
        - Buchstaben des Alphabets
        - Überschriften, Seitenzahlen, Übungsanweisungen
        - Unvollständige Einträge (z.B. nur "etw." oder "jdm." ohne den Rest der Übersetzung)

        Aufgabe:
        1. Behalte NUR echte Vokabelpaare (Deutsch ↔ $lang_name).
        2. Wenn ein Eintrag mehrere Übersetzungen enthält, trenne sie mit Semikolon (;).
        3. Entferne Nummerierungen und überflüssige Sonderzeichen.
        4. Korrigiere offensichtliche OCR-Fehler (z.B. fehlende Akzente).
        5. Behalte Artikel (der/die/das, le/la/les etc.) bei.
        6. Wenn eine Übersetzung aus mehreren Teilen besteht die offensichtlich zusammengehören (z.B. "etw." + "tauschen"), füge sie zu einem Eintrag zusammen (z.B. "etw. tauschen").
        7. Behalte Abkürzungen wie "etw." (etwas), "jdn." (jemanden), "jdm." (jemandem) als Teil der Übersetzung bei.
        8. Wenn KEINE gültigen Vokabelpaare vorhanden sind, antworte mit einem leeren Array: []

        Antworte NUR mit einem JSON-Array im Format:
        [{"source": "deutsch", "target": "übersetzung"}]

        Keine Erklärungen, kein Markdown, nur das JSON-Array.

        Extrahierte Paare:
        $pairs_text

  # ============================================================
  # Bedrock Guardrail — content filter + prompt-attack protection
  # applied to the extraction LLM calls (user-uploaded OCR text).
  # ============================================================
  ExtractionGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub vocabtrainer-extraction-guardrail-${Environment}
      Description: Content + prompt-attack filter for vocabulary extraction from user images.
      BlockedInputMessaging: "Der Inhalt konnte nicht verarbeitet werden."
      BlockedOutputsMessaging: "Der Inhalt konnte nicht verarbeitet werden."
      # The model output is structured vocabulary JSON, not free-form generated
      # text, so OUTPUT content filtering only produces false positives (observed:
      # MISCONDUCT MEDIUM blocking harmless French/German vocab). We guard the
      # INPUT (user-uploaded OCR) but set every OutputStrength to NONE.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: NONE
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: NONE
          - Type: HATE
            InputStrength: MEDIUM
            OutputStrength: NONE
          - Type: INSULTS
            InputStrength: MEDIUM
            OutputStrength: NONE
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: NONE
          # Prompt-attack filtering only applies to the input; output strength must be NONE.
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      Tags:
        - Key: Project
          Value: VocabTrainer
        - Key: Environment
          Value: !Ref Environment

  ExtractionGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt ExtractionGuardrail.GuardrailId
      Description: !Sub Deployed version for ${Environment}

  # ============================================================
  # League Lambda Function
  # ============================================================
  LeagueHandlerFunction:
