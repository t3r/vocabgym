                - polly:SynthesizeSpeech
                - polly:DescribeVoices
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${ImagesBucket}/tts/*'
      Events:
        GetVoices:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /tts/voices
            Method: GET
        Synthesize:
          Type: Api
          Properties:
            RestApiId: !Ref VocabTrainerApi
            Path: /tts/synthesize
            Method: POST

  # Icon Handler — event-driven robohash identicon generator.
  # Triggered via EventBridge when an original scan is uploaded under images/.
  # Renders both styles (robots + cats) per page and caches them in identicons/.
  # This is the ONLY function carrying the Pillow/robohash dependency.
  IconHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vocabtrainer-icon-handler-${Environment}
      CodeUri: functions/icon_handler/
      Handler: app.lambda_handler
      MemorySize: 1024        # Pillow rendering headroom
      Timeout: 60
      Environment:
        Variables:
          ICON_SIZE: '256'
      Policies:
        - Version: '2012-10-17'
          Statement:
            # Read to check idempotency (head_object), write the rendered icons.
            # Scoped to the identicons/ prefix; the handler never reads originals.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${ImagesBucket}/identicons/*'
      Events:
        PageUploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref ImagesBucket
                object:
                  key:
                    - prefix: images/

